# Edit a logged workout (bench 185 × 5, 205 × 3) from History, see the edit in Previous, and check
# Records (max weight and estimated 1RM from the heaviest set: 205 × 3 → 205 × (1 + 3/30) ≈ 226).
appId: ${APP_ID}
---
# Starting state from the test-build seed link (src/lib/e2eScenarios.ts), not setup taps.
- clearState
- openLink: liftbook://e2e-seed?scenario=bench-history
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# History → the workout → edit set 1 to 185 × 6.
- tapOn: "History"
- tapOn:
    id: "history-card-.*"
- assertVisible: '185lb × 5'
- tapOn:
    id: "edit-workout"
- tapOn:
    id: "reps-0-0"
- eraseText
- inputText: "6"
- hideKeyboard
- tapOn:
    id: "save-workout-edit"
- assertVisible: '185lb × 6'
- takeScreenshot: 05-history-edited
- back

# Records for bench press.
- tapOn: "Analytics"
- tapOn:
    id: "open-exercises"
- tapOn:
    id: "exercise-search"
- inputText: "bench press barbell"
- tapOn: 'Bench Press \(Barbell\)'
- assertVisible:
    text: '205 lb'
    childOf:
      id: "record-weight"
- assertVisible:
    text: '226 lb'
    childOf:
      id: "record-e1rm"
- takeScreenshot: 05-records
- takeScreenshot:
    path: el-record-tiles
    cropOn:
      id: "record-e1rm"

# The edit shows up as Previous in a new session.
- back
- back
- tapOn: "Home"
- scrollUntilVisible:
    element:
      id: "repeat-workout"
    direction: DOWN
- tapOn:
    id: "repeat-workout"
- assertVisible:
    id: "prev-0-0"
    text: '.*185lb × 6.*'
