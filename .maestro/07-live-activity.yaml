# iOS only: a running workout shows a Live Activity (Dynamic Island + lock screen) with the
# next set and a count-up clock. Maestro can't read outside the app, so this captures
# screenshots for review rather than asserting the island's contents.
appId: ${APP_ID}
tags:
  - ios-only
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- tapOn:
    id: "start-next-workout"
- pressKey: Home
- waitForAnimationToEnd
- takeScreenshot: 04-dynamic-island
- launchApp # back via the app icon; the workout is still running
- extendedWaitUntil:
    visible:
      id: "resume-workout"
    timeout: 10000

# Rest: checking a set starts the rest timer; the island and the lock screen count it down.
- tapOn:
    id: "resume-workout"
- tapOn:
    id: "weight-0-0"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-0"
- tapOn:
    id: "keypad-next"
- tapOn:
    id: "key-8"
- tapOn:
    id: "keypad-hide"
- tapOn:
    id: "check-0-0"
- assertVisible:
    id: "rest-bar"
- pressKey: Home
- waitForAnimationToEnd
- takeScreenshot: 05-dynamic-island-rest
- pressKey: Lock
- waitForAnimationToEnd
- takeScreenshot: 06-lock-screen-rest
